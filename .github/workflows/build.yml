name: Build, deploy, and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint source and tests
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Package GitHub Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  browser:
    name: Browser tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Groups are Playwright projects in playwright.config.ts; studio splits by test across two runners.
      matrix:
        include:
          - group: 3D terrain
            slug: 3d-terrain
            args: --project=3d-terrain
          - group: 3D tools
            slug: 3d-tools
            args: --project=3d-tools
          - group: studio 1/2
            slug: studio-1
            args: --project=studio --shard=1/2
          - group: studio 2/2
            slug: studio-2
            args: --project=studio --shard=2/2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Build browser test specimens
        run: npm run build:specimens

      - name: Verify browser journeys and GitHub Pages subpath
        run: npx playwright test --reporter=list ${{ matrix.args }}

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.slug }}
          path: test-results
          retention-days: 7

  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20.19.0'
          - os: ubuntu-latest
            node: '22.13.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test packed CLI through npm
        run: npm run test:package

  publish:
    name: Publish npm package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check release version
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          // Trusted publishing only works for a package that already exists on npm.
          const pkg = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`, {
            signal: AbortSignal.timeout(30_000),
          });
          if (pkg.status === 404) {
            console.log(`::warning::${name} is not on npm yet. Publish it once by hand and add this workflow as its trusted publisher; until then CI skips publishing.`);
            process.exit(0);
          }
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`, {
            signal: AbortSignal.timeout(30_000),
          });
          if (response.ok) {
            console.log(`${name}@${version} is already published; skipping.`);
          } else if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'should-publish=true\n');
          } else {
            throw new Error(`npm registry check failed: HTTP ${response.status}`);
          }
          NODE

      - name: Set up Node.js for npm publishing
        if: steps.release.outputs.should-publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing (OIDC) needs npm 11.5.1 or later
      - name: Update npm
        if: steps.release.outputs.should-publish == 'true'
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        if: steps.release.outputs.should-publish == 'true'
        run: npm ci

      - name: Publish new version with provenance
        if: steps.release.outputs.should-publish == 'true'
        run: npm publish --provenance

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy site artifact
        id: deployment
        uses: actions/deploy-pages@v5
