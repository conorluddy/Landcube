name: Build, deploy, and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint source and tests
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify browser journeys and GitHub Pages subpath
        run: npx playwright test --reporter=list

      - name: Package GitHub Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20.19.0'
          - os: ubuntu-latest
            node: '22.13.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test packed CLI through npm
        run: npm run test:package

  publish:
    name: Publish npm package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check release version
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`, {
            signal: AbortSignal.timeout(30_000),
          });
          if (response.ok) {
            console.log(`${name}@${version} is already published; skipping.`);
          } else if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'should-publish=true\n');
          } else {
            throw new Error(`npm registry check failed: HTTP ${response.status}`);
          }
          NODE

      - name: Set up Node.js for npm publishing
        if: steps.release.outputs.should-publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing (OIDC) needs npm 11.5.1 or later
      - name: Update npm
        if: steps.release.outputs.should-publish == 'true'
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        if: steps.release.outputs.should-publish == 'true'
        run: npm ci

      - name: Publish new version with provenance
        if: steps.release.outputs.should-publish == 'true'
        run: npm publish --provenance

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site artifact
        id: deployment
        uses: actions/deploy-pages@v4
